name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Build (tsc -b)
        run: npm run build
      - name: Typecheck do app
        run: npx tsc --noEmit -p tsconfig.json
      - name: Typecheck dos testes
        run: npm run test:types
      - name: Testes
        run: npm test
