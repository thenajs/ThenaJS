name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci

      # Duas varreduras, com pesos diferentes de propósito.
      #
      # A que **reprova** olha só o que é publicado (`--omit=dev`): é o que chega
      # na máquina de quem instala, e falha `high` ali é motivo para parar a
      # esteira. Hoje a árvore de produção é `zod` e mais nada, então este passo
      # é barato e quase sempre verde — o que é o ponto: quando ficar vermelho,
      # é de verdade.
      #
      # A informativa cobre o build inteiro e **não** reprova. Uma falha num
      # transitivo do `vite` não é motivo para travar a release de um pacote que
      # não o embala; é motivo para o Dependabot abrir PR, que é o que ele faz.
      - name: Auditoria (produção)
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoria (build, informativa)
        run: npm audit || true

      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Build (tsc -b)
        run: npm run build
      - name: Typecheck do app
        run: npx tsc --noEmit -p tsconfig.json
      - name: Typecheck dos testes
        run: npm run test:types

      # A UI do Flow tem tsconfig próprio e fica fora do `tsc -b` da raiz: o
      # build dela é `vite build`, e o esbuild remove os tipos sem conferi-los.
      # Sem esta etapa, um erro de tipo na interface chega ao npm — foi assim
      # que três bugs de rename foram publicados na 0.9.0.
      - name: Typecheck da UI do Flow
        run: npm run typecheck:ui --workspace @thenajs/flow
      # `test:coverage` no lugar de `test`: roda a mesma suíte e ainda reprova
      # se a cobertura cair abaixo da linha de base medida. Um só passo, porque
      # dois rodariam os mesmos 477 testes duas vezes.
      - name: Testes e cobertura
        run: npm run test:coverage
