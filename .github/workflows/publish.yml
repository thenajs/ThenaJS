name: Publish packages

# Publica os pacotes @thenajs/* no npm público quando você cria uma tag "v*"
# (ex.: git tag v0.1.1 && git push --tags) ou manualmente pela aba Actions.
#
# Pré-requisitos:
#   - Secret NPM_TOKEN (npm automation token, com acesso à org thenajs).
#   - Bump da versão nos package.json antes de taggar (versão já publicada falha).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessário para o npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (na ordem de dependência)
        run: |
          for pkg in agentflow core tools qdrant-client cli; do
            echo "→ publicando @thenajs/$pkg"
            npm publish --workspace "@thenajs/$pkg" --provenance --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
